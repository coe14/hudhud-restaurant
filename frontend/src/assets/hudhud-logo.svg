
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F3D99A"/>
      <stop offset="100%" stop-color="#B9954F"/>
    </linearGradient>
  </defs>

  <rect width="900" height="600" rx="24" fill="#123D30"/>

  <!-- Islamic arch -->
  <path d="M300 265 V190 Q450 15 600 190 V265"
