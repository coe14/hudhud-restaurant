  <path d="M315 265 V195 Q450 45 585 195 V265"
        fill="none" stroke="#D6B779" stroke-width="1.5" opacity=".6"/>

  <!-- Stylized hoopoe bird -->
  <g fill="url(#gold)">
    <path d="M390 200 Q355 165 375 125 Q383 153 400 163
             Q393 130 415 105 Q416 143 433 158
             Q442 128 465 115 Q454 154 454 170
             Q495 153 525 180 Q493 175 472 195
             Q449 217 421 214 Q400 213 390 200Z"/>
    <path d="M410 190 Q455 170 493 191 Q465 202 437 226
             Q421 239 399 228 Q415 215 410 190Z"/>
    <path d="M438 213 Q472 224 510 213 Q481 240 444 237
             Q421 237 402 226Z" opacity=".8"/>
    <path d="M520 180 L562 168 L530 190Z"/>
    <circle cx="476" cy="180" r="3" fill="#123D30"/>
  </g>

  <!-- Wordmark -->
  <text x="450" y="335" text-anchor="middle"
        font-family="Georgia, serif" font-size="82"
